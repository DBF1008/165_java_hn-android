buildscript {
    repositories {
        mavenCentral()
    }
}

apply plugin: 'com.android.application'

dependencies {
    annotationProcessor "org.androidannotations:androidannotations:4.8.0"
    implementation "org.androidannotations:androidannotations-api:4.8.0"

    // Dependency injection (Dagger 2). Pure-Java annotation processing (no kapt);
    // coexists with AndroidAnnotations because it does not wrap Application/Activity.
    implementation "com.google.dagger:dagger:2.48.1"
    annotationProcessor "com.google.dagger:dagger-compiler:2.48.1"

    implementation "androidx.core:core:1.9.0"
    implementation "androidx.legacy:legacy-support-core-utils:1.0.0"
    implementation "androidx.appcompat:appcompat:1.5.1"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"

    implementation "cz.msebera.android:httpclient:4.5.8"

    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Unit tests (pure JVM). jsoup is a local jar, so add it explicitly to the
    // test classpath to be safe.
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.mockito:mockito-core:4.11.0"
    testImplementation files('libs/jsoup-1.7.2.jar')
}

android {
    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.manuelmaly.hn"
        minSdkVersion 14
        targetSdkVersion 33
        versionCode 26
        versionName "1.9.16"
    }

    // Only load release signing config when release.properties is present, and do
    // it lazily inside the release block. Previously this ran at configuration time
    // unconditionally, which broke EVERY gradle task (including `test`) when the
    // file was absent.
    def releaseProps = rootProject.file("release.properties")

    signingConfigs {
        if (releaseProps.exists()) {
            release {
                def props = new Properties()
                props.load(new FileInputStream(releaseProps))
                storeFile new File(props.keyStore.toString())
                storePassword props.keyStorePassword
                keyAlias props.keyAlias
                keyPassword props.keyAliasPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseProps.exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'

            applicationVariants.all { variant ->
                variant.outputs.each { output ->
                    def outputFile = output.outputFileName
                    if (outputFile != null && outputFile.endsWith('.apk')) {
                        def fileName = outputFile.replace('.apk',
                                "-v${versionName}-b${versionCode}.apk")
                        output.outputFileName = fileName
                    }
                }
            }
        }

        debug {

        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }

    namespace 'com.manuelmaly.hn'
}
